<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tio Nan | Novo Site em Breve</title>

    <meta name="description"
          content="Vem aí um novo site Tio Nan. A mesma essência de sempre.">

    <meta name="robots" content="index, follow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #f8f4ec;
            overflow: hidden;
        }

        .pagina {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #f8f4ec;
        }

        picture {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;
        }

        .imagem-site {
            display: block;

            width: auto;
            height: auto;

            max-width: 92vw;
            max-height: 92vh;

            object-fit: contain;
            object-position: center;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .imagem-site {
                max-width: 100vw;
                max-height: 100vh;

                width: 100%;
                height: 100%;

                object-fit: contain;
                object-position: center;
            }

        }
    </style>

</head>

<body>

    <main class="pagina">

        <picture>

            <!-- MOBILE -->
            <source
                media="(max-width: 768px)"
                srcset="novosite-mobile.webp">

            <!-- DESKTOP -->
            <img
                class="imagem-site"
                src="novosite.webp"
                alt="Vem aí um novo site Tio Nan - A mesma essência de sempre">

        </picture>

    </main>

</body>

</html>
