<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Tio Nan | Novo Site em Breve</title>

    <meta name="description"
          content="Vem aí um novo site Tio Nan. A mesma essência de sempre.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #f8f4ec;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .pagina {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f8f4ec;
            overflow: hidden;
        }

        picture {
            display: block;
            width: 100%;
            height: 100%;
        }

        .imagem-site {
            display: block;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            object-fit: contain;
            object-position: center;

            margin: 0 auto;
        }

        /* DESKTOP */
        @media (min-width: 769px) {

            .imagem-site {
                width: 92vw;
                height: 92vh;

                max-width: 1600px;

                object-fit: contain;
            }

        }

        /* MOBILE */
        @media (max-width: 768px) {

            .pagina {
                align-items: center;
                justify-content: center;
            }

            .imagem-site {
                width: 100vw;
                height: 100dvh;

                object-fit: contain;
                object-position: center;
            }

        }
    </style>
</head>

<body>

    <main class="pagina">

        <picture>

            <!-- MOBILE -->
            <source
                media="(max-width: 768px)"
                srcset="novosite-mobile.webp">

            <!-- DESKTOP -->
            <img
                class="imagem-site"
                src="novosite.webp"
                alt="Vem aí um novo site Tio Nan"
            >

        </picture>

    </main>

</body>

</html>
