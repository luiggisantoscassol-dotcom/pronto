<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tio Nan | Projeto em Andamento</title>

    <meta name="description"
          content="Vem aí uma nova Tio Nan. Projeto em andamento.">

    <meta name="robots" content="index, follow">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: #f7f3eb;
        }

        .pagina {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #f7f3eb;

            overflow: hidden;
        }

        .pagina img {
            display: block;

            width: 90%;
            max-width: 1600px;

            height: auto;
            max-height: 92vh;

            object-fit: contain;
        }


        /* CELULAR */
        @media (max-width: 768px) {

            .pagina {
                min-height: 100vh;
            }

            .pagina img {
                width: 100%;
                max-height: 100vh;
                object-fit: contain;
            }

        }

    </style>

</head>


<body>

    <main class="pagina">

        <img
            src="novosite.webp"
            alt="Vem aí uma nova Tio Nan - Projeto em andamento"
        >

    </main>

</body>

</html>
