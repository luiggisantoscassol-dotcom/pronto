<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Todos os produtos | Tio Nan</title>
  <style>
    @font-face{font-family:Gin;src:url('GinTest-Round.otf') format('opentype');font-display:swap}
    :root{--navy:#15365f;--ink:#192238;--gold:#b98c3a;--line:#e7eaf0}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.header{height:70px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.back{justify-self:center;color:var(--navy);font-size:29px;text-decoration:none}.brand{justify-self:center;color:#000;font:400 27px/1 Gin,Georgia,serif;letter-spacing:.01em;text-decoration:none}.cart{justify-self:center;color:var(--navy);font-size:24px;text-decoration:none}.page{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:42px 0 65px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.page h1{margin:8px 0 9px;color:var(--navy);font-size:clamp(32px,5vw,52px);letter-spacing:-.04em}.intro{margin:0 0 30px;color:#647086}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{display:flex;flex-direction:column;min-height:430px;border:1px solid #e8e6df;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 25px rgba(24,43,69,.07);text-decoration:none;color:inherit;transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-4px);box-shadow:0 16px 31px rgba(24,43,69,.13)}.photo{height:285px;display:grid;place-items:center;background:#faf9f5}.photo img{width:100%;height:100%;padding:18px;object-fit:contain;mix-blend-mode:multiply}.card-content{padding:17px 18px 20px;margin-top:auto}.card h2{margin:0 0 8px;color:var(--navy);font-size:21px}.price{color:#111;font-weight:800;font-size:20px}.action{display:inline-block;margin-top:16px;color:var(--navy);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}@media(max-width:700px){.page{width:100%;padding:30px 20px 45px}.grid{display:flex;overflow-x:auto;gap:13px;margin-right:-20px;padding:0 20px 14px 0;scroll-snap-type:x mandatory}.card{flex:0 0 min(78vw,310px);min-height:410px;scroll-snap-align:start}.photo{height:265px}}
  </style>
</head>
<body>
  <header class="header"><a class="back" href="index.html" aria-label="Voltar">‹</a><a class="brand" href="index.html">TIO NAN</a><a class="cart" href="index.html#vitrine" aria-label="Voltar para a loja">🛒</a></header>
  <main class="page"><span class="eyebrow">Loja Tio Nan</span><h1>Todos os produtos</h1><p class="intro">Escolha o seu próximo brinde.</p><section class="grid" id="products"><p>Carregando produtos…</p></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db=window.supabase.createClient('https://eegqobqhrfdkmjyjnqvp.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZ3FvYnFocmZka21qeWpucXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjU5NzcsImV4cCI6MjA5MzEwMTk3N30.rHSlJ1Fv0oSEsJc4r44czBs3Lb6dkfWl-WwtIHawpys');
    const normalize=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^cachaca\s+/,'').trim();
    const photo=p=>p.foto_1||(normalize(p.nome).includes('gengibre')?'fotos/gengibre-guaco-mel.webp?v=4':normalize(p.nome).includes('ouro')?'fotos/cachaca-ouro.webp?v=1':'fotos/produto-em-breve.svg');
    const format=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    async function load(){const box=document.getElementById('products');const {data=[]}=await db.from('produtos').select('*').eq('excluido',false);const blingIds=new Set(['16687078597','16699660347']);const siteIds=new Set(['3e878921-6b60-4cc6-b5d9-3faa25d9a9d9']);let list=data.filter(p=>blingIds.has(String(p.bling_id||''))||siteIds.has(String(p.id||''))||normalize(p.nome).includes('gengibre guaco e mel'));if(!list.some(p=>String(p.bling_id)==='16699660347'||normalize(p.nome).includes('ouro')))list.push({id:'cachaca-ouro-local',nome:'Cachaça Ouro',preco:50,foto_1:'fotos/cachaca-ouro.webp'});if(!list.some(p=>String(p.bling_id)==='16687078597'||normalize(p.nome).includes('prata')))list.push({id:'cachaca-prata-local',nome:'Cachaça Prata',preco:50});box.innerHTML=list.map(p=>{const url=`produto.html?id=${encodeURIComponent(p.id)}`;return `<a class="card" href="${url}"><div class="photo"><img src="${photo(p)}" alt="${p.nome}"></div><div class="card-content"><h2>${p.nome}</h2><div class="price">${format(p.preco)}</div><span class="action">Ver produto →</span></div></a>`}).join('')||'<p>Nenhum produto disponível no momento.</p>'}load();
  </script>
</body></html>
