<html lang="pt-BR">
<head>

  <style>
    @font-face{font-family:Gin;src:url('GinTest-Round.otf') format('opentype');font-display:swap}
    :root{--navy:#15365f;--ink:#192238;--gold:#b98c3a;--line:#e7eaf0}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.header{height:70px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.back{justify-self:center;color:var(--navy);font-size:29px;text-decoration:none}.brand{justify-self:center;color:#000;font:400 27px/1 Gin,Georgia,serif;letter-spacing:.01em;text-decoration:none}.cart{justify-self:center;color:var(--navy);font-size:24px;text-decoration:none}.page{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:42px 0 65px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.page h1{margin:8px 0 9px;color:var(--navy);font-size:clamp(32px,5vw,52px);letter-spacing:-.04em}.intro{margin:0 0 30px;color:#647086}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{display:grid;grid-template-rows:auto 1fr;min-height:520px;border:1px solid #e8e6df;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 25px rgba(24,43,69,.07);text-decoration:none;color:inherit;transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-4px);box-shadow:0 16px 31px rgba(24,43,69,.13)}.photo{min-width:0;aspect-ratio:1/1;overflow:hidden;background:#fff;border-bottom:1px solid #eeeae2}.photo img{display:block;width:100%;height:100%;object-fit:cover}.photo.placeholder{display:grid;place-items:center;background:#faf9f5}.photo.placeholder img{width:78%;height:78%;object-fit:contain;mix-blend-mode:multiply}.card-content{min-width:0;padding:18px 20px 21px;display:flex;flex-direction:column;align-items:flex-start}.card h2{margin:0 0 10px;color:var(--navy);font-size:19px;line-height:1.22;overflow-wrap:anywhere}.price{color:#111;font-weight:800;font-size:20px}.action{display:inline-block;margin-top:auto;padding-top:18px;color:var(--navy);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}@media(max-width:700px){.page{width:100%;padding:30px 20px 45px}.grid{display:flex;overflow-x:auto;gap:13px;margin-right:-20px;padding:0 20px 14px 0;scroll-snap-type:x mandatory}.card{flex:0 0 min(78vw,310px);grid-template-rows:auto 1fr;min-height:475px;scroll-snap-align:start}}
  </style>
  <style>
    @media (max-width: 700px) {
      .page { width: 100%; padding: 28px 14px 44px; }
      .intro { margin-bottom: 22px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-right: 0;
        padding: 0;
        overflow: visible;
        scroll-snap-type: none;
      }
      .card {
        min-width: 0;
        min-height: 350px;
        grid-template-rows: auto 1fr;
        border-radius: 14px;
        box-shadow: 0 7px 18px rgba(24, 43, 69, .08);
      }
      .card:hover { transform: none; }
      .card-content { padding: 13px 12px 15px; }
      .card h2 {
        margin-bottom: 8px;
        font-size: clamp(13px, 3.6vw, 16px);
        line-height: 1.18;
      }
      .price { font-size: clamp(15px, 4vw, 18px); }
      .price small { font-size: 11px; }
      .price em { display: block; margin-top: 3px; }
      .action { padding-top: 14px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="header"><a class="back" href="index.html" aria-label="Voltar">‹</a><a class="brand" href="index.html">TIO NAN</a><a class="cart" href="index.html#vitrine" aria-label="Voltar para a loja">🛒</a></header>
  <main class="page"><span class="eyebrow">Loja Tio Nan</span><h1>Todos os produtos</h1><p class="intro">Escolha o seu próximo brinde.</p><section class="grid" id="products"><p>Carregando produtos…</p></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db=window.supabase.createClient('https://eegqobqhrfdkmjyjnqvp.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZ3FvYnFocmZka21qeWpucXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjU5NzcsImV4cCI6MjA5MzEwMTk3N30.rHSlJ1Fv0oSEsJc4r44czBs3Lb6dkfWl-WwtIHawpys');
    const normalize=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^cachaca\s+/,'').trim();
    const photo=p=>p.foto_1||(p.tipo_produto==='kit'?'fotos/produto-em-breve.svg':String(p.bling_id)==='16699719562'?'fotos/gengibre-guaco-mel.webp?v=5':String(p.bling_id)==='16699660347'?'fotos/cachaca-ouro.webp?v=2':String(p.bling_id)==='16687078597'?'fotos/produto-em-breve.svg':normalize(p.nome).includes('gengibre')?'fotos/gengibre-guaco-mel.webp?v=5':normalize(p.nome).includes('ouro')?'fotos/cachaca-ouro.webp?v=2':'fotos/produto-em-breve.svg');
    const format=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const displayName=p=>String(p.nome||'');
    const slug=v=>normalize(v).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    const productUrl=p=>['localhost','127.0.0.1'].includes(location.hostname)?`produto.html?id=${encodeURIComponent(p.id)}`:`/produtos/${slug(p.nome)}`;
    async function load(){const box=document.getElementById('products');const {data=[],error}=await db.from('produtos').select('*').eq('excluido',false).or('visivel.eq.true,visivel.is.null');if(error){box.innerHTML='<p>Não foi possível carregar os produtos agora.</p>';return}const order=['16699719562','16699660347','16687078597'];const priority=new Map(order.map((id,index)=>[id,index]));const list=data.filter(p=>order.includes(String(p.bling_id||''))||(p.tipo_produto==='kit'&&p.visivel===true)).sort((a,b)=>(priority.get(String(a.bling_id||''))??order.length)-(priority.get(String(b.bling_id||''))??order.length)||String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));box.innerHTML=list.map((p,index)=>{const url=productUrl(p);const src=photo(p);const placeholder=src.includes('produto-em-breve.svg');const nome=displayName(p);const promo=Number(p.preco_original||0)>Number(p.preco||0);const price=promo?`<small style="display:block;color:#7b8492;text-decoration:line-through;margin-bottom:4px">De ${format(p.preco_original)}</small><div>Por ${format(p.preco)} <em style="font-size:11px;color:#197347">${Math.round((1-Number(p.preco)/Number(p.preco_original))*100)}% OFF</em></div>`:format(p.preco);return `<a class="card" href="${url}"><div class="photo${placeholder?' placeholder':''}"><img src="${src}" alt="${nome}" loading="${index<3?'eager':'lazy'}" decoding="async" onerror="this.onerror=null;this.src='fotos/produto-em-breve.svg'"></div><div class="card-content"><h2>${nome}</h2><div class="price">${price}</div><span class="action">Ver produto →</span></div></a>`}).join('')||'<p>Nenhum produto disponível no momento.</p>'}load();
  </script>
</body></html>
