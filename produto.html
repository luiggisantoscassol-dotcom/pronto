<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Produto | Tio Nan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    @font-face { font-family: "Gin Tio Nan"; src: url("GinTest-Round.otf") format("opentype"); font-display: swap; }
    :root { --navy:#15365f; --navy-dark:#0c2340; --gold:#b98c3a; --ink:#172238; --muted:#677085; --line:#e6e9ee; --cream:#fbfaf7; }
    * { box-sizing:border-box; }
    body { margin:0; padding:0 0 96px; font-family: Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
    button { font:inherit; cursor:pointer; }
    .site-header { position:sticky; top:0; z-index:20; height:74px; display:grid; grid-template-columns:64px 1fr 64px; align-items:center; background:#fff; border-bottom:1px solid var(--line); }
    .head-action { width:44px; height:44px; margin:auto; border:0; background:transparent; color:var(--navy-dark); display:grid; place-items:center; }
    .head-action svg { width:26px; height:26px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .brand { justify-self:center; color:#000; font-family:"Gin Tio Nan", Georgia, serif; font-size:27px; letter-spacing:.01em; text-decoration:none; line-height:1; }
    .cart-button { position:relative; }
    .cart-count { position:absolute; top:2px; right:1px; min-width:17px; height:17px; padding:0 4px; display:grid; place-items:center; border-radius:50%; background:#111; color:#fff; font-size:10px; font-weight:700; }
    .product-page { width:min(1180px, 100%); margin:0 auto; padding:22px 18px 30px; }
    .crumbs { margin:16px 0 18px; color:#647086; font-size:14px; }
    .crumbs a { color:inherit; text-decoration:none; }
    .layout { display:grid; grid-template-columns:minmax(360px, .95fr) minmax(380px, 1.05fr); gap:clamp(32px, 6vw, 88px); align-items:start; }
    .gallery { position:sticky; top:94px; min-height:560px; display:grid; place-items:center; border:1px solid #ece8df; border-radius:26px; overflow:hidden; background:radial-gradient(circle at 50% 28%, #fff 0 30%, #f8f6f0 100%); }
    .gallery img { width:100%; height:100%; max-height:630px; min-height:520px; object-fit:contain; padding:26px; mix-blend-mode:multiply; }
    .tag { display:inline-block; margin:2px 0 11px; color:var(--gold); font-size:12px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; color:var(--navy-dark); font-size:clamp(30px, 4vw, 47px); line-height:1.08; letter-spacing:-.035em; }
    .rating { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:19px 0 22px; font-size:15px; }
    .stars { color:#d19b23; font-size:23px; letter-spacing:1px; line-height:1; }
    .rating-note { color:var(--muted); }
    .reviews-link { padding:0; border:0; background:transparent; color:var(--navy); font:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px; }
    .price-box { padding:22px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .price-label { display:block; margin-bottom:4px; color:var(--muted); font-size:13px; }
    .price { color:#101b2e; font-size:36px; font-weight:800; letter-spacing:-.04em; }
    .payment-note { margin:7px 0 0; color:#5d6677; font-size:14px; }
    .product-copy { margin:23px 0 10px; color:#4c5667; font-size:16px; line-height:1.65; }
    details { border-top:1px solid var(--line); }
    details:last-of-type { border-bottom:1px solid var(--line); }
    summary { list-style:none; padding:18px 2px; color:var(--navy-dark); font-size:16px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
    summary::-webkit-details-marker { display:none; }
    summary::after { content:"+"; color:var(--gold); font-size:25px; line-height:16px; font-weight:400; }
    details[open] summary::after { content:"–"; }
    .detail-content { padding:0 2px 19px; color:#576174; line-height:1.65; font-size:15px; }
    .detail-list { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; margin:0; }
    .detail-list div { padding-top:8px; border-top:1px solid #f0f1f3; }
    .detail-list dt { color:#7b8491; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
    .detail-list dd { margin:4px 0 0; color:var(--ink); font-weight:600; }
    .buy-row { display:flex; gap:14px; align-items:center; margin-top:26px; }
    .quantity { height:52px; display:flex; align-items:center; border:1px solid #cdd3db; border-radius:12px; overflow:hidden; background:white; }
    .quantity button { width:44px; height:100%; border:0; background:white; color:var(--navy-dark); font-size:24px; }
    .quantity output { min-width:31px; text-align:center; font-weight:700; }
    .buy-button { flex:1; min-height:54px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-size:16px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; box-shadow:0 9px 20px rgba(21,54,95,.19); }
    .buy-button:hover { background:var(--navy-dark); }
    .notice { min-height:20px; margin:13px 0 0; color:#277044; font-size:14px; font-weight:600; }
    .shipping { margin-top:22px; padding:18px; border-radius:14px; background:var(--cream); border:1px solid #eee9df; }
    .shipping-label { display:block; margin-bottom:10px; color:var(--navy-dark); font-size:14px; font-weight:800; }
    .shipping-row { display:flex; gap:9px; }
    .shipping input { width:100%; min-width:0; height:46px; padding:0 13px; border:1px solid #cdd3db; border-radius:9px; background:#fff; color:var(--ink); font-size:15px; }
    .shipping button { flex:0 0 auto; height:46px; padding:0 15px; border:0; border-radius:9px; background:var(--navy); color:#fff; font-weight:800; }
    .shipping-result { min-height:18px; margin:9px 0 0; color:#647086; font-size:13px; }
    .reviews-section { width:min(760px, 100%); margin:62px auto 0; padding-top:31px; border-top:1px solid var(--line); }
    .reviews-heading { margin:0 0 7px; color:var(--navy-dark); font-size:28px; letter-spacing:-.025em; }
    .reviews-summary { margin:0 0 23px; color:var(--muted); }
    .review-filters { display:flex; flex-wrap:wrap; gap:8px; margin:-8px 0 22px; }
    .review-filter { padding:8px 12px; border:1px solid #d7dde5; border-radius:999px; background:#fff; color:#566174; font-size:13px; font-weight:700; }
    .review-filter.is-active { border-color:var(--navy); background:var(--navy); color:#fff; }
    .review-card { padding:20px 0; border-top:1px solid var(--line); }
    .review-meta { display:flex; align-items:baseline; justify-content:space-between; gap:14px; color:var(--navy-dark); font-size:14px; font-weight:800; }
    .review-date { color:#7c8593; font-size:12px; font-weight:500; white-space:nowrap; }
    .review-stars { margin:8px 0; color:#d19b23; letter-spacing:1px; }
    .review-comment { margin:0; color:#4e5868; font-size:15px; line-height:1.6; }
    .reviews-empty { padding:22px 0; color:var(--muted); border-top:1px solid var(--line); }
    .loading, .not-found { min-height:60vh; display:grid; place-items:center; color:var(--muted); text-align:center; }
    .not-found a { color:var(--navy); font-weight:bold; }
    @media (max-width:760px) {
      body { padding-bottom:95px; }
      .site-header { height:68px; grid-template-columns:58px 1fr 58px; }
      .brand { font-size:24px; }
      .product-page { padding:0 0 24px; }
      .layout { display:flex; flex-direction:column; gap:0; }
      .gallery { order:0; width:100%; min-height:0; height:calc(100vw * .95); border:0; border-radius:0; background:#faf9f5; position:relative; top:auto; }
      .gallery img { min-height:0; height:100%; max-height:none; padding:14px 22px; }
      .product-info { width:100%; padding:0 24px; }
      .crumbs { margin:24px 0 20px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .tag { margin-bottom:9px; }
      h1 { font-size:31px; }
      .rating { margin:15px 0 19px; }
      .stars { font-size:21px; }
      .price-box { padding:18px 0; }
      .price { font-size:31px; }
      .product-copy { font-size:15px; margin-top:20px; }
      .buy-row { display:none; }
      .shipping { margin-top:18px; padding:15px; }
      .reviews-section { width:auto; margin:44px 24px 0; padding-top:25px; }
      .reviews-heading { font-size:25px; }
      .mobile-buy-bar { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; gap:11px; align-items:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid var(--line); box-shadow:0 -8px 22px rgba(18,31,48,.08); }
      .mobile-buy-bar .quantity { height:51px; flex:0 0 auto; }
      .mobile-buy-bar .buy-button { min-height:51px; }
    }
    @media (min-width:761px) { .mobile-buy-bar { display:none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="head-action" href="index.html" aria-label="Voltar para a loja">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <a class="brand" href="index.html">TIO NAN</a>
    <a class="head-action cart-button" href="index.html#vitrine" aria-label="Ver carrinho">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </a>
  </header>

  <main class="product-page" id="app">
    <div class="loading">Carregando produto…</div>
  </main>

  <div class="mobile-buy-bar" id="mobile-buy" hidden>
    <div class="quantity" aria-label="Quantidade">
      <button type="button" data-quantity="-1" aria-label="Diminuir quantidade">−</button>
      <output id="mobile-quantity">1</output>
      <button type="button" data-quantity="1" aria-label="Aumentar quantidade">+</button>
    </div>
    <button class="buy-button" id="mobile-buy-button" type="button">Comprar</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://eegqobqhrfdkmjyjnqvp.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZ3FvYnFocmZka21qeWpucXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjU5NzcsImV4cCI6MjA5MzEwMTk3N30.rHSlJ1Fv0oSEsJc4r44czBs3Lb6dkfWl-WwtIHawpys';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);
    const app = document.getElementById('app');
    let product = null;
    let quantity = 1;

    function cart() { try { return JSON.parse(sessionStorage.getItem('tioNanCart') || '[]'); } catch { return []; } }
    function updateCartCount() { document.getElementById('cart-count').textContent = cart().reduce((sum, item) => sum + (Number(item.qtd) || Number(item.quantidade) || 0), 0); }
    function money(value) { return Number(value || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
    function normalize(value) { return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    function isGengibreGuacoMel(p) { const name = normalize(p.nome); return name.includes('gengibre') && name.includes('guaco') && name.includes('mel'); }
    function reviewKey(value) {
      const name = normalize(value).replace(/[^a-z0-9]+/g, ' ').trim();
      if (name.includes('gengibre') && name.includes('guaco') && name.includes('mel')) return 'gengibre guaco e mel';
      if (name.includes('ouro')) return 'ouro';
      if (name.includes('prata')) return 'prata';
      return name;
    }
    function photoFor(p) {
      const name = normalize(p.nome);
      const savedPhoto = String(p.foto_1 || '').trim();
      const savedFile = savedPhoto.split('?')[0].split('/').pop().toLowerCase();
      if (name.includes('gengibre') && name.includes('guaco') && ['gengibre.png', 'gengibre-2.png'].includes(savedFile)) {
        return 'fotos/gengibre-guaco-mel.webp?v=4';
      }
      return savedPhoto || (name.includes('gengibre') && name.includes('guaco') ? 'fotos/gengibre-guaco-mel.webp?v=4' : name.includes('ouro') ? 'fotos/cachaca-ouro.webp?v=1' : 'fotos/produto-em-breve.svg');
    }
    function updateQuantity(delta) {
      quantity = Math.max(1, quantity + delta);
      document.querySelectorAll('[data-quantity-output]').forEach(el => el.textContent = quantity);
      document.getElementById('mobile-quantity').textContent = quantity;
    }
    function addToCart() {
      if (!product) return;
      const currentCart = cart();
      const item = currentCart.find(item => String(item.id) === String(product.id));
      if (item) item.qtd = (Number(item.qtd) || Number(item.quantidade) || 0) + quantity;
      else currentCart.push({ id:product.id, name:product.nome, price:Number(product.preco || 0), cost:0, foto:photoFor(product), qtd:quantity });
      sessionStorage.setItem('tioNanCart', JSON.stringify(currentCart));
      updateCartCount();
      document.querySelectorAll('.notice').forEach(el => el.textContent = 'Produto adicionado ao carrinho.');
      document.querySelectorAll('.buy-button').forEach(button => { button.textContent = 'Adicionado ✓'; setTimeout(() => button.textContent = 'Comprar', 1600); });
      setTimeout(() => window.location.href = 'index.html?carrinho=1', 350);
    }
    function maskCep(input) {
      const digits = input.value.replace(/\D/g, '').slice(0, 8);
      input.value = digits.length > 5 ? `${digits.slice(0, 5)}-${digits.slice(5)}` : digits;
    }
    async function checkCep() {
      const input = document.getElementById('shipping-cep');
      const result = document.getElementById('shipping-result');
      const cep = input.value.replace(/\D/g, '');
      if (cep.length !== 8) { result.textContent = 'Informe um CEP válido com 8 números.'; return; }
      result.textContent = 'Consultando CEP…';
      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const address = await response.json();
        result.textContent = address.erro ? 'CEP não encontrado. Verifique e tente novamente.' : `Entrega para ${address.localidade}/${address.uf}. As opções aparecem no checkout.`;
      } catch { result.textContent = 'Não foi possível consultar o CEP agora. Tente novamente.'; }
    }
    async function reviewsFor(name) {
      const { data } = await db.from('avaliacoes').select('*').order('created_at', { ascending:false });
      const key = reviewKey(name);
      const reviews = (data || []).filter(review => reviewKey(review.produto_nome) === key);
      if (!reviews.length) return { count:0, average:0 };
      reviews.sort((a, b) => {
        const aHasDescription = Boolean(a.comentario && a.comentario.trim());
        const bHasDescription = Boolean(b.comentario && b.comentario.trim());
        if (aHasDescription !== bHasDescription) return aHasDescription ? -1 : 1;
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
      return { count:reviews.length, average:reviews.reduce((sum, r) => sum + Number(r.estrelas || 0), 0) / reviews.length, reviews };
    }
    function escapeHtml(value) { const temp = document.createElement('div'); temp.textContent = value || ''; return temp.innerHTML; }
    function reviewList(reviews) {
      if (!reviews.length) return '<p class="reviews-empty">Este produto ainda não tem avaliações. Seja a primeira pessoa a compartilhar sua experiência.</p>';
      return reviews.map(review => {
        const name = escapeHtml(review.cliente_nome ? review.cliente_nome.trim().toUpperCase() : 'CLIENTE TIO NAN');
        const hasComment = Boolean(review.comentario && review.comentario.trim());
        const comment = escapeHtml(hasComment ? review.comentario.trim() : 'Avaliou este produto sem deixar descrição.');
        const date = review.created_at ? new Date(review.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' }) : '';
        const rating = Math.min(5, Math.max(0, Number(review.estrelas || 0)));
        const stars = '★'.repeat(rating) + '☆'.repeat(5 - rating);
        return `<article class="review-card" data-has-description="${hasComment ? 'true' : 'false'}"><div class="review-meta"><span>${name}</span><time class="review-date">${date}</time></div><div class="review-stars" aria-label="${rating} de 5 estrelas">${stars}</div><p class="review-comment">“${comment}”</p></article>`;
      }).join('');
    }
    function render(p, review) {
      const score = review.count ? review.average.toFixed(1).replace('.', ',') : '';
      const stars = review.count ? '★★★★★' : '☆☆☆☆☆';
      const reviews = review.reviews || [];
      const gengibreGuacoMel = isGengibreGuacoMel(p);
      const description = p.descricao || (gengibreGuacoMel
        ? 'Uma alquimia perfeita para quem aprecia intensidade e conforto. O calor picante do gengibre fresco desperta o paladar, enquanto o guaco traz notas herbais profundas que remetem à tradição do campo. A finalização fica por conta da doçura aveludada do mel, que suaviza a potência da cachaça e deixa um retrogosto acolhedor. Ideal para dias frios ou para momentos de puro relaxamento.'
        : 'Uma cachaça Tio Nan para celebrar bons encontros e transformar cada brinde em história.');
      const volume = p.volume || '700 ml';
      const alcohol = gengibreGuacoMel ? '28% vol.' : (p.teor_alcoolico ? `${p.teor_alcoolico}% vol.` : 'Consulte o rótulo');
      const category = gengibreGuacoMel ? 'Bebida mista' : 'Cachaça premium';
      const productType = gengibreGuacoMel ? 'Bebida mista à base de cachaça Tio Nan' : 'Cachaça Tio Nan';
      app.innerHTML = `
        <div class="layout">
          <section class="gallery" aria-label="Imagem de ${p.nome}"><img src="${photoFor(p)}" alt="${p.nome}" /></section>
          <section class="product-info">
            <nav class="crumbs" aria-label="Navegação"><a href="index.html">Início</a> &nbsp;›&nbsp; <a href="index.html#vitrine">Produtos</a> &nbsp;›&nbsp; ${p.nome}</nav>
            <span class="tag">${productType}</span>
            <h1>${p.nome}</h1>
            <div class="rating" aria-label="Avaliação do produto"><span class="stars">${stars}</span>${review.count ? `<strong>${score} de 5</strong><button type="button" class="reviews-link" data-scroll-reviews>(${review.count} ${review.count === 1 ? 'avaliação' : 'avaliações'})</button>` : '<span class="rating-note">Ainda sem avaliações</span>'}</div>
            <div class="price-box"><span class="price-label">Por apenas</span><strong class="price">${money(p.preco)}</strong><p class="payment-note">Compra segura e finalização no checkout.</p></div>
            <p class="product-copy">${description}</p>
            <details open><summary>Detalhes do produto</summary><div class="detail-content"><dl class="detail-list"><div><dt>Volume</dt><dd>${volume}</dd></div><div><dt>Teor alcoólico</dt><dd>${alcohol}</dd></div><div><dt>Categoria</dt><dd>${category}</dd></div><div><dt>Origem</dt><dd>Rio Grande do Sul</dd></div></dl></div></details>
            <details><summary>Entrega e pagamento</summary><div class="detail-content">Informe seu CEP no checkout para visualizar as opções de entrega disponíveis para a sua região.</div></details>
            <div class="buy-row"><div class="quantity" aria-label="Quantidade"><button type="button" data-quantity="-1" aria-label="Diminuir quantidade">−</button><output data-quantity-output>1</output><button type="button" data-quantity="1" aria-label="Aumentar quantidade">+</button></div><button class="buy-button" type="button" data-buy>Comprar</button></div>
            <p class="notice" aria-live="polite"></p>
            <div class="shipping"><label class="shipping-label" for="shipping-cep">Calcule a entrega pelo seu CEP</label><div class="shipping-row"><input id="shipping-cep" inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000" aria-describedby="shipping-result"><button type="button" id="shipping-button">Consultar</button></div><p class="shipping-result" id="shipping-result" aria-live="polite"></p></div>
          </section>
        </div>
        <section class="reviews-section" id="avaliacoes" aria-labelledby="reviews-heading"><h2 class="reviews-heading" id="reviews-heading">Avaliações de quem já provou</h2><p class="reviews-summary">${review.count ? `${score} de 5 com base em ${review.count} ${review.count === 1 ? 'avaliação' : 'avaliações'}.` : 'Opiniões de clientes aparecerão aqui.'}</p>${review.count ? '<div class="review-filters" aria-label="Filtrar avaliações"><button class="review-filter is-active" type="button" data-review-filter="all">Todas</button><button class="review-filter" type="button" data-review-filter="with-description">Com descrição</button><button class="review-filter" type="button" data-review-filter="without-description">Sem descrição</button></div>' : ''}${reviewList(reviews)}</section>`;
      document.getElementById('mobile-buy').hidden = false;
      document.querySelectorAll('[data-quantity]').forEach(button => button.addEventListener('click', () => updateQuantity(Number(button.dataset.quantity))));
      document.querySelectorAll('[data-buy]').forEach(button => button.addEventListener('click', addToCart));
      document.getElementById('mobile-buy-button').addEventListener('click', addToCart);
      document.querySelectorAll('[data-scroll-reviews]').forEach(button => button.addEventListener('click', () => document.getElementById('avaliacoes').scrollIntoView({ behavior:'smooth', block:'start' })));
      document.querySelectorAll('[data-review-filter]').forEach(button => button.addEventListener('click', () => {
        const filter = button.dataset.reviewFilter;
        document.querySelectorAll('[data-review-filter]').forEach(item => item.classList.toggle('is-active', item === button));
        document.querySelectorAll('.review-card').forEach(card => {
          const hasDescription = card.dataset.hasDescription === 'true';
          card.hidden = filter === 'with-description' ? !hasDescription : filter === 'without-description' ? hasDescription : false;
        });
      }));
      const cepInput = document.getElementById('shipping-cep');
      cepInput.addEventListener('input', () => maskCep(cepInput));
      cepInput.addEventListener('keydown', event => { if (event.key === 'Enter') checkCep(); });
      document.getElementById('shipping-button').addEventListener('click', checkCep);
    }
    async function init() {
      updateCartCount();
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const name = params.get('nome');
      if (!id && !name) { app.innerHTML = '<div class="not-found"><div><p>Produto não encontrado.</p><a href="index.html#vitrine">Voltar para os produtos</a></div></div>'; return; }
      let data = null; let error = null;
      if (id) ({ data, error } = await db.from('produtos').select('*').eq('id', id).eq('excluido', false).maybeSingle());
      else ({ data, error } = await db.from('produtos').select('*').eq('nome', name).eq('excluido', false).maybeSingle());
      const localOuro = id === 'cachaca-ouro-local' ? {
        id: 'cachaca-ouro-local', nome: 'Cachaça Ouro', preco: 50, estoque: 1,
        foto_1: 'fotos/cachaca-ouro.webp', teor_alcoolico: '39,5',
        descricao: 'Envelhecida em carvalho para um sabor suave e marcante. Uma cachaça premium que carrega o tempo, a tradição e a qualidade em cada gole.'
      } : null;
      const localPrata = id === 'cachaca-prata-local' ? {
        id: 'cachaca-prata-local', nome: 'Cachaça Prata', preco: 50, estoque: 1,
        descricao: 'Leve, autêntica e feita para bons encontros. Uma cachaça Tio Nan para servir pura, em drinks ou para acompanhar o seu brinde.'
      } : null;
      const selectedProduct = data || localOuro || localPrata;
      if (!selectedProduct) { app.innerHTML = '<div class="not-found"><div><p>Não foi possível encontrar este produto.</p><a href="index.html#vitrine">Voltar para os produtos</a></div></div>'; return; }
      product = selectedProduct;
      const review = await reviewsFor(selectedProduct.nome);
      render(selectedProduct, review);
      document.title = `${selectedProduct.nome} | Tio Nan`;
    }
    init();
  </script>
</body>
</html>
