    function reviewKey(value) {

      if (name.includes('ouro')) return 'ouro';

    function photoFor(p) {

      if (p.tipo_produto === 'kit') return 'fotos/produto-em-breve.svg';
      if (blingId === '16712113631' || blingId === '16712114193') return 'fotos/produto-em-breve.svg';
      if (blingId === '16699719562') return 'fotos/gengibre-guaco-mel.webp?v=5';
      if (blingId === '16699660347') return 'fotos/cachaca-ouro.webp?v=2';
      if (blingId === '16687078597') return 'fotos/produto-em-breve.svg';

      if (name.includes('gengibre') && name.includes('guaco') && ['gengibre.png', 'gengibre-2.png'].includes(savedFile)) {
        return 'fotos/gengibre-guaco-mel.webp?v=5';
      }
      return savedPhoto || (name.includes('gengibre') && name.includes('guaco') ? 'fotos/gengibre-guaco-mel.webp?v=5' : name.includes('ouro') ? 'fotos/cachaca-ouro.webp?v=2' : 'fotos/produto-em-breve.svg');
    }
    function normalizePhotoUrl(value) {
      const url = String(value || '').trim();
      if (!url || !url.includes('drive.google')) return url;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match?.[1] ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1200` : url;
    }
    function productPhotosFor(p) {
      const main = normalizePhotoUrl(photoFor(p));

      return [...new Set(registered)];

    function productVideoFor(p) {
      return String(p.bling_id || '') === '16687078597' ? 'fotos/tio-nan-prata-video.mp4?v=2' : '';
    }
    function absoluteUrl(value) {
      try { return new URL(String(value || ''), 'https://www.tionan.com.br/').href; }

    }

      const element = document.querySelector(selector);

    function updateSeo(p, review, description) {
      const displayName = displayNameFor(p);
      const title = `${displayName} | Tio Nan`;
      const summary = String(description || '').replace(/\s+/g, ' ').trim().slice(0, 155);
      const url = `https://www.tionan.com.br/produtos/${productSlug(p.nome)}`;
      const image = absoluteUrl(photoFor(p));
      const price = Number(p.preco || 0).toFixed(2);
      document.title = title;
      document.getElementById('seo-canonical').href = url;
      setMeta('meta[name="description"]', summary);

      setMeta('meta[name="twitter:title"]', title);
      setMeta('meta[name="twitter:description"]', summary);
      setMeta('meta[name="twitter:image"]', image);
      const schema = {
        '@context': 'https://schema.org',

    function updateQuantity(delta) {
      const stock = Math.max(0, Number(product?.estoque || 0));
      if (stock <= 0) return;
      quantity = Math.min(stock, Math.max(1, quantity + delta));
      document.querySelectorAll('[data-quantity-output]').forEach(el => el.textContent = quantity);
      document.getElementById('mobile-quantity').textContent = quantity;
      if (shippingPostalCode.length === 8) {
        clearTimeout(shippingRefreshTimer);
        shippingRefreshTimer = setTimeout(checkCep, 350);

    function addToCart() {
      if (!product) return;
      if (product.lancado === false) {
        document.querySelectorAll('.notice').forEach(el => el.textContent = 'Este produto ainda não foi lançado. Em breve estará disponível.');

      const stock = Math.max(0, Number(product.estoque || 0));
      if (stock <= 0) {
        document.querySelectorAll('.notice').forEach(el => el.textContent = 'Este produto está esgotado no momento. Volta logo!');

      const currentCart = cart();

      if (item) { item.qtd = (Number(item.qtd) || Number(item.quantidade) || 0) + quantity; item.displayName = displayNameFor(product); item.displaySubtitle = displaySubtitleFor(product); item.unidadesPorKit = Math.max(1,Number(product.unidades_por_kit || item.unidadesPorKit || 1)); }
      else currentCart.push({ id:product.id, name:product.nome, displayName:displayNameFor(product), displaySubtitle:displaySubtitleFor(product), price:Number(product.preco || 0), cost:0, foto:photoFor(product), qtd:quantity, unidadesPorKit:Math.max(1,Number(product.unidades_por_kit || 1)) });
      sessionStorage.setItem('tioNanCart', JSON.stringify(currentCart));
      if (shippingPostalCode.length === 8) {
        sessionStorage.setItem('tioNanCheckoutCep', shippingPostalCode);
        if (selectedShipping) sessionStorage.setItem('tioNanCheckoutEntrega', JSON.stringify(selectedShipping));

    function handleBuyIntent() {

    async function checkCep() {
      const input = document.getElementById('shipping-cep');
      const result = document.getElementById('shipping-result');
      const cep = input.value.replace(/\D/g, '');
      if (cep.length !== 8) {
        result.textContent = 'Informe um CEP válido com 8 números.';
        if (cep.length > 0) trackProductShipping('shipping_postal_invalid', '❌ CEP incompleto no produto', { digitos_informados:cep.length });

              transportadora:freight?.transportadora || null,

    function setupProductGallery(product) {
      const track = document.querySelector('[data-product-gallery-track]');
      if (!track) return;
      const slides = [...track.querySelectorAll('.product-gallery-slide')];
      const dots = [...document.querySelectorAll('.product-gallery-dot')];
      const thumbs = [...document.querySelectorAll('[data-gallery-thumb]')];
      if (slides.length < 2) return;
      let scrollFrame = 0;
      const updateDots = () => {
        const index = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / Math.max(1, track.clientWidth))));
        dots.forEach((dot, dotIndex) => dot.classList.toggle('is-active', dotIndex === index));
        thumbs.forEach((thumb, thumbIndex) => {
          const active = thumbIndex === index;
          thumb.classList.toggle('is-active', active);
          thumb.setAttribute('aria-current', active ? 'true' : 'false');
        });
      };
      thumbs.forEach((thumb, index) => thumb.addEventListener('click', () => {

      }));
      track.addEventListener('scroll', () => {
        cancelAnimationFrame(scrollFrame);
        scrollFrame = requestAnimationFrame(updateDots);
      }, { passive:true });

      let startX = 0;
      let startScroll = 0;

        if (event.pointerType !== 'mouse' || event.button !== 0) return;

        startX = event.clientX;

        track.setPointerCapture(event.pointerId);

      track.addEventListener('pointermove', event => {
        if (!dragging) return;

      const finishDrag = event => {
        if (!dragging) return;

        track.classList.remove('is-dragging');
        if (track.hasPointerCapture(event.pointerId)) track.releasePointerCapture(event.pointerId);
        const index = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / Math.max(1, track.clientWidth))));

      };

            <details><summary>Entrega e pagamento</summary><div class="detail-content">Informe seu CEP no checkout para visualizar as opções de entrega disponíveis para a sua região.</div></details>
          </section>
        </div>
        <section class="reviews-section" id="avaliacoes" aria-labelledby="reviews-heading"><h2 class="reviews-heading" id="reviews-heading">Avaliações de quem já provou</h2><p class="reviews-summary">${reviewsSummary}</p>${review.count ? '<div class="review-filters" aria-label="Filtrar avaliações"><button class="review-filter is-active" type="button" data-review-filter="all">Todas</button><button class="review-filter" type="button" data-review-filter="with-description">Com descrição</button><button class="review-filter" type="button" data-review-filter="without-description">Sem descrição</button></div>' : ''}${reviewList(reviews)}</section>`;
      const mobileBuy = document.getElementById('mobile-buy');
      const mobileQuantity = mobileBuy.querySelector('.quantity');
      const mobileBuyButton = document.getElementById('mobile-buy-button');
      mobileBuy.hidden = false;
      mobileQuantity.hidden = unavailable;
      mobileBuyButton.disabled = unavailable;
      mobileBuyButton.textContent = buyLabel;
      setupProductGallery(p);
      document.querySelectorAll('[data-quantity]').forEach(button => button.addEventListener('click', () => updateQuantity(Number(button.dataset.quantity))));
      document.querySelectorAll('[data-buy]').forEach(button => button.addEventListener('click', handleBuyIntent));
      document.querySelector('[data-offers-group]')?.addEventListener('click', () => {
        window.TioNanAnalytics?.track('offer_group_click', { label:'Grupo de ofertas', produto_id:p.id });
        window.gtag?.('event', 'select_promotion', { promotion_name:'Grupo de ofertas', items:[{ item_id:String(p.id), item_name:displayName }] });
      });
      if (!unavailable) mobileBuyButton.addEventListener('click', handleBuyIntent);
      document.querySelectorAll('[data-scroll-reviews]').forEach(button => button.addEventListener('click', () => document.getElementById('avaliacoes').scrollIntoView({ behavior:'smooth', block:'start' })));
      document.querySelectorAll('[data-review-filter]').forEach(button => button.addEventListener('click', () => {
        const filter = button.dataset.reviewFilter;
        document.querySelectorAll('[data-review-filter]').forEach(item => item.classList.toggle('is-active', item === button));
        document.querySelectorAll('.review-card').forEach(card => {
          const hasDescription = card.dataset.hasDescription === 'true';
          card.hidden = filter === 'with-description' ? !hasDescription : filter === 'without-description' ? hasDescription : false;
        });
      }));
      const cepInput = document.getElementById('shipping-cep');
      cepInput.addEventListener('input', () => {
        maskCep(cepInput);
        const cepLength = cepInput.value.replace(/\D/g, '').length;
        if (cepInput.value.replace(/\D/g, '') !== shippingPostalCode) {
          productShippingTracking.quoted = false;
          selectedShipping = null;
        }
        if (cepLength > 0 && !productShippingTracking.started) {
          productShippingTracking.started = true;
          trackProductShipping('shipping_postal_started', '📍 Começou a digitar o CEP no produto');
        }
        if (cepLength === 8) {
          clearTimeout(shippingRefreshTimer);
          shippingRefreshTimer = setTimeout(checkCep, 280);
        }
      });
      cepInput.addEventListener('keydown', event => { if (event.key === 'Enter') checkCep(); });
      document.getElementById('shipping-button').addEventListener('click', checkCep);
      window.addEventListener('pagehide', () => trackProductShippingAbandon(), { once:true });
    }
    async function init() {
      updateCartCount();
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const blingId = params.get('bling');
      const name = params.get('nome');
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const pathSlug = pathParts[0] === 'produtos' ? decodeURIComponent(pathParts.slice(1).join('/')) : '';
      const slug = params.get('slug') || pathSlug;
      if (!id && !blingId && !name && !slug) { app.innerHTML = '<div class="not-found"><div><p>Produto não encontrado.</p><a href="index.html#vitrine">Voltar para os produtos</a></div></div>'; return; }
      let data = null; let error = null;
      if (id) ({ data, error } = await db.from('produtos').select('*').eq('id', id).eq('excluido', false).maybeSingle());
      else if (blingId) ({ data, error } = await db.from('produtos').select('*').eq('bling_id', blingId).eq('excluido', false).maybeSingle());
      else if (name) ({ data, error } = await db.from('produtos').select('*').eq('nome', name).eq('excluido', false).maybeSingle());
      else {
        const response = await db.from('produtos').select('*').eq('excluido', false);
        error = response.error;
        const products = response.data || [];
        data = products.find(item => {
          const itemSlug = productSlug(item.nome);
          return itemSlug === slug || itemSlug.replace(/^cachaca-/, '') === slug;
        }) || null;
      }
      const localOuro = id === 'cachaca-ouro-local' ? {
        id: 'cachaca-ouro-local', nome: 'Cachaça Ouro', preco: 50, estoque: 1,
        foto_1: 'fotos/cachaca-ouro.webp', teor_alcoolico: '39,5',
        descricao: 'Envelhecida em carvalho para um sabor suave e marcante. Uma cachaça premium que carrega o tempo, a tradição e a qualidade em cada gole.'
      } : null;
      const localPrata = id === 'cachaca-prata-local' ? {
        id: 'cachaca-prata-local', nome: 'Cachaça Prata', preco: 50, estoque: 1,
        descricao: 'Leve, autêntica e feita para bons encontros. Uma cachaça Tio Nan para servir pura, em drinks ou para acompanhar o seu brinde.'
      } : null;
      const selectedProduct = data || localOuro || localPrata;
      if (!selectedProduct) { app.innerHTML = '<div class="not-found"><div><p>Não foi possível encontrar este produto.</p><a href="index.html#vitrine">Voltar para os produtos</a></div></div>'; return; }
      product = selectedProduct;
      window.TioNanAnalytics?.track('product_view', { label:selectedProduct.nome, produto_id:selectedProduct.id, valor:Number(selectedProduct.preco || 0) });
      window.TioNanPixel?.viewContent({ id:selectedProduct.id, name:selectedProduct.nome, value:Number(selectedProduct.preco || 0), category:selectedProduct.categoria });
      window.gtag?.('event', 'view_item', {
        currency:'BRL',
        value:Number(selectedProduct.preco || 0),
        items:[{ item_id:String(selectedProduct.id), item_name:displayNameFor(selectedProduct), price:Number(selectedProduct.preco || 0), quantity:1 }]
      });
      const review = await reviewsFor(selectedProduct.nome);
      render(selectedProduct, review);
      const trackedDepths = new Set();
      const trackScrollDepth = () => {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        if (scrollable <= 0) return;
        const depth = Math.min(100, Math.round((window.scrollY / scrollable) * 100));
        [25, 50, 75, 90].forEach(mark => {
          if (depth < mark || trackedDepths.has(mark)) return;
          trackedDepths.add(mark);
          if (mark === 50) window.TioNanAnalytics?.track('scroll_depth', { label:'Rolou a página', produto_id:selectedProduct.id, metadata:{ percentual:mark } });
          window.gtag?.('event', 'scroll_depth', { percent_scrolled:mark, item_id:String(selectedProduct.id) });
        });
        if (trackedDepths.has(90)) window.removeEventListener('scroll', trackScrollDepth);
      };
      window.addEventListener('scroll', trackScrollDepth, { passive:true });
      if (/(^|\.)tionan\.com\.br$/i.test(window.location.hostname)) {
        const friendlyPath = `/produtos/${productSlug(selectedProduct.nome)}`;
        if (window.location.pathname !== friendlyPath) history.replaceState(null, '', friendlyPath);
      }
    }
    init();
  </script>
  <script src="story-video.js?v=11"></script>
</body>
