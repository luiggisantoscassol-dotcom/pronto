<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acompanhar pedido | Tio Nan</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root{--navy:#1b365d;--gold:#c5a059;--paper:#f7f4ee;--muted:#737b86}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Arial,sans-serif}
    main{width:min(680px,calc(100% - 32px));margin:0 auto;padding:52px 0}.card{background:#fff;border:1px solid rgba(27,54,93,.1);border-radius:24px;padding:32px;box-shadow:0 18px 55px rgba(27,54,93,.1)}
    .brand{display:block;width:190px;max-width:70%;height:auto;margin:0 auto 30px}.success-icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:30px}
    h1{text-align:center;margin:0 0 10px;font-size:clamp(1.7rem,6vw,2.4rem)}.lead{text-align:center;color:var(--muted);line-height:1.55;margin:0 auto 22px;max-width:460px}.order-code{text-align:center;font-size:.78rem;letter-spacing:1px;color:var(--muted);margin-bottom:24px}
    button,.home{width:100%;min-height:54px;border-radius:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;cursor:pointer}.primary{border:1px solid var(--gold);background:var(--navy);color:#fff}.home{display:grid;place-items:center;margin-top:10px;border:1px solid rgba(27,54,93,.2);color:var(--navy);text-decoration:none}.tracking-code-box{display:none;margin:0 0 22px;padding:14px;border:1px solid rgba(27,54,93,.12);border-radius:12px;background:var(--paper)}.tracking-code-box label{display:block;margin-bottom:6px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1px}.tracking-code-line{display:flex;align-items:center;gap:8px}.tracking-code-line code{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;font-size:.72rem;color:var(--muted)}.copy-code{width:auto;min-height:36px;padding:0 12px;border:1px solid rgba(27,54,93,.2);background:#fff;color:var(--navy);font-size:.68rem}
    #tracking{display:none;margin-top:34px;padding-top:28px;border-top:1px solid #e8e8e8}.tracking-title{margin:0 0 24px;font-size:1rem;text-transform:uppercase;letter-spacing:2px}.timeline{display:grid;gap:0}.step{position:relative;display:grid;grid-template-columns:38px 1fr;gap:14px;min-height:76px;color:#9ba0a7}.step:not(:last-child)::after{content:'';position:absolute;left:18px;top:38px;bottom:0;width:2px;background:#ddd}.dot{position:relative;z-index:1;width:38px;height:38px;border:2px solid #c8cbd0;border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:900}.step.done,.step.active{color:var(--navy)}.step.done .dot{background:var(--navy);border-color:var(--navy);color:#fff}.step.active .dot{border-color:var(--gold);box-shadow:0 0 0 4px rgba(197,160,89,.15)}.step.done:not(:last-child)::after{background:var(--navy)}.step b{display:block;margin:7px 0 3px}.step small{color:var(--muted)}.error{text-align:center;color:#a52a2a;padding:20px}
    @media(max-width:520px){main{padding:20px 0}.card{padding:24px 18px;border-radius:18px}}
  </style>
</head>
<body><main><div class="card"><img class="brand" src="logo-tio-nan-email.png" alt="Tio Nan"><div class="success-icon">✓</div><h1 id="title">Pedido feito com sucesso!</h1><p class="lead">Recebemos seu pedido. Agora você pode acompanhar cada etapa por aqui.</p><div class="order-code" id="order-code">Consultando pedido…</div><div class="tracking-code-box" id="tracking-code-box"><label>Código de rastreio</label><div class="tracking-code-line"><code id="tracking-code"></code><button class="copy-code" id="copy-code" type="button">Copiar</button></div></div><button class="primary" id="track-button">Acompanhar pedido</button><section id="tracking"><h2 class="tracking-title">Etapas do pedido</h2><div id="timeline" class="timeline"></div></section><a class="home" href="index.html">Voltar para a loja</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="pedido.js?v=1.0"></script></body>
</html>
